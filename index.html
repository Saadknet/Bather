<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة البذر والمركب المتطورة</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --compound-color: #1565c0;
            --bg-color: #f0f4f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: var(--primary-color); margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        /* تنسيق خيار يوجد مركب */
        .checkbox-group {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-group input { width: auto; margin-left: 10px; transform: scale(1.5); }

        #compoundSection {
            display: none;
            border-right: 4px solid var(--compound-color);
            padding-right: 15px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid;
            text-align: center;
        }

        .seed-box { border-color: var(--primary-color); background: #f1f8e9; }
        .compound-box { border-color: var(--compound-color); background: #e3f2fd; margin-top: 10px; }

        .res-title { font-size: 0.85rem; color: #666; display: block; margin-bottom: 5px; }
        .res-value { font-size: 1.6rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة بيانات المزرعة</h2>
    
    <div class="input-group">
        <label>اسم المزرعة</label>
        <input type="text" id="farmName" placeholder="أدخل اسم المزرعة">
    </div>

    <div class="input-group">
        <label>مساحة الرشاش (هكتار)</label>
        <input type="number" id="area" inputmode="decimal">
    </div>

    <div class="input-group">
        <label>عدد أكياس البذر</label>
        <input type="number" id="bags" inputmode="numeric">
    </div>

    <div class="input-group">
        <label>وزن أكياس البذر (كجم)</label>
        <input type="number" id="weight" inputmode="decimal">
    </div>

    <div class="input-group">
        <label>عدد الأوجه للبذر</label>
        <input type="number" id="faces" inputmode="numeric">
    </div>

    <!-- خيار يوجد مركب -->
    <div class="checkbox-group" onclick="toggleCompound()">
        <input type="checkbox" id="hasCompound">
        <label style="margin:0; cursor:pointer;">يوجد مركب</label>
    </div>

    <!-- قسم المركب المخفي -->
    <div id="compoundSection">
        <div class="input-group">
            <label>عدد أكياس المركب</label>
            <input type="number" id="cBags" inputmode="numeric">
        </div>
        <div class="input-group">
            <label>وزن أكياس المركب (كجم)</label>
            <input type="number" id="cWeight" inputmode="decimal">
        </div>
    </div>

    <button onclick="calculateAll()">إصدار التقرير</button>

    <!-- النتائج -->
    <div id="resultsArea" style="display:none;">
        <div class="result-box seed-box">
            <span class="res-title">وزن البذر النهائي</span>
            <span id="seedRes" class="res-value"></span>
        </div>

        <div class="result-box compound-box">
            <span class="res-title">وزن المركب</span>
            <span id="compoundRes" class="res-value"></span>
        </div>
    </div>
</div>

<script>
    function toggleCompound() {
        const section = document.getElementById('compoundSection');
        const checkbox = document.getElementById('hasCompound');
        section.style.display = checkbox.checked ? 'block' : 'none';
    }

    function calculateAll() {
        const area = parseFloat(document.getElementById('area').value);
        const bags = parseFloat(document.getElementById('bags').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const faces = parseFloat(document.getElementById('faces').value);
        const hasCompound = document.getElementById('hasCompound').checked;

        if (!area || !bags || !weight || !faces) {
            alert("يرجى إكمال بيانات البذر الأساسية");
            return;
        }

        // 1. حساب البذر (المعادلة السابقة)
        let seedKg = (((bags * weight) / (area / 100)) / faces) / 10000;
        let seedText = seedKg < 1 ? (seedKg * 1000).toFixed(2) + " جرام" : seedKg.toFixed(4) + " كجم";

        // 2. حساب المركب
        let compoundText = "لا يوجد مركب";
        if (hasCompound) {
            const cBags = parseFloat(document.getElementById('cBags').value);
            const cWeight = parseFloat(document.getElementById('cWeight').value);

            if (cBags && cWeight) {
                // المعادلة: (الأكياس * الوزن) / (المساحة / 100)
                let compoundVal = (cBags * cWeight) / (area / 100);
                
                if (compoundVal >= 1000) {
                    compoundText = (compoundVal / 1000).toFixed(2) + " كجم";
                } else {
                    compoundText = compoundVal.toFixed(2) + " جرام";
                }
            } else {
                alert("يرجى إكمال بيانات المركب");
                return;
            }
        }

        // عرض النتائج
        document.getElementById('seedRes').innerText = seedText;
        document.getElementById('compoundRes').innerText = compoundText;
        document.getElementById('resultsArea').style.display = 'block';
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
