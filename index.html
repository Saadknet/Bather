<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة وزن البذارة Tume 4000</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --compound-color: #1565c0;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: var(--primary-color); border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .input-section { margin-bottom: 20px; }
        
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 0.9rem; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .checkbox-card {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            border: 1px solid #d1d9e0;
        }

        .checkbox-card input { width: auto; margin-left: 10px; margin-bottom: 0; transform: scale(1.3); }

        #compoundFields { display: none; padding: 10px; border-right: 4px solid var(--compound-color); background: #fafafa; border-radius: 0 8px 8px 0; }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* إطار النتيجة المربع */
        #finalReport {
            margin-top: 25px;
            border: 2px solid #333;
            border-radius: 15px;
            overflow: hidden;
            display: none;
            background: white;
        }

        .report-header {
            background: #333;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        .report-body { padding: 15px; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.95rem; }

        .label-cell { color: #777; width: 45%; }
        .value-cell { font-weight: bold; text-align: left; color: #222; }

        .result-highlight {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .seed-res { background: #e8f5e9; border: 1px solid #c8e6c9; color: #1b5e20; }
        .comp-res { background: #e3f2fd; border: 1px solid #bbdefb; color: #0d47a1; margin-top: 10px; }

        .big-val { font-size: 1.5rem; display: block; font-weight: 900; }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة وزن البذارة Tume 4000</h2>
    
    <div class="input-section">
        <label>أسم المزرعة</label>
        <input type="text" id="fName" placeholder="أدخل اسم المزرعة">

        <label>مساحة الرشاش (هكتار)</label>
        <input type="number" id="v1" inputmode="decimal">

        <label>عدد أكياس البذر</label>
        <input type="number" id="v2" inputmode="numeric">

        <label>وزن أكياس البذر (كجم)</label>
        <input type="number" id="v3" inputmode="decimal">

        <label>عدد الأوجه للبذر</label>
        <input type="number" id="v4" inputmode="numeric">

        <div class="checkbox-card" onclick="document.getElementById('hasComp').click()">
            <input type="checkbox" id="hasComp" onclick="event.stopPropagation(); toggleComp()">
            <label style="margin:0; cursor:pointer;">يوجد مركب</label>
        </div>

        <div id="compoundFields">
            <label>عدد أكياس المركب</label>
            <input type="number" id="c1" inputmode="numeric">
            <label>وزن أكياس المركب (كجم)</label>
            <input type="number" id="c2" inputmode="decimal">
        </div>
    </div>

    <button onclick="generateReport()">اصدار تقرير الوزن</button>

    <div id="finalReport">
        <div class="report-header">تقرير وزن البذارة</div>
        <div class="report-body">
            <table>
                <tr><td class="label-cell">اسم المزرعة:</td><td id="rFarm" class="value-cell"></td></tr>
                <tr><td class="label-cell">المساحة:</td><td id="rArea" class="value-cell"></td></tr>
                <tr><td class="label-cell">بيانات البذر:</td><td id="rSeedInfo" class="value-cell"></td></tr>
                <tr><td class="label-cell">عدد الأوجه:</td><td id="rFaces" class="value-cell"></td></tr>
                <tr id="compRow" style="display:none;"><td class="label-cell">بيانات المركب:</td><td id="rCompInfo" class="value-cell"></td></tr>
            </table>

            <div class="result-highlight seed-res">
                <small>وزن البذر النهائي</small>
                <span id="resSeed" class="big-val"></span>
            </div>

            <div class="result-highlight comp-res">
                <small>وزن المركب</small>
                <span id="resComp" class="big-val"></span>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleComp() {
        const checked = document.getElementById('hasComp').checked;
        document.getElementById('compoundFields').style.display = checked ? 'block' : 'none';
    }

    function generateReport() {
        const farm = document.getElementById('fName').value || "غير مسجل";
        const area = parseFloat(document.getElementById('v1').value);
        const sBags = parseFloat(document.getElementById('v2').value);
        const sWeight = parseFloat(document.getElementById('v3').value);
        const faces = parseFloat(document.getElementById('v4').value);
        const isComp = document.getElementById('hasComp').checked;

        if (!area || !sBags || !sWeight || !faces) {
            alert("يرجى إدخال كافة بيانات البذر الأساسية");
            return;
        }

        // حساب البذر
        let seedResultKg = (((sBags * sWeight) / (area / 100)) / faces) / 10000;
        let seedDisplay = "";
        
        // التحويل التلقائي: إذا كان الوزن < 1 كجم (أي < 1000 جرام)
        if (seedResultKg < 1) {
            seedDisplay = (seedResultKg * 1000).toFixed(2) + " جرام";
        } else {
            seedDisplay = seedResultKg.toFixed(4) + " كجم";
        }

        // تعبئة البيانات
        document.getElementById('rFarm').innerText = farm;
        document.getElementById('rArea').innerText = area + " هكتار";
        document.getElementById('rSeedInfo').innerText = sBags + " كيس × " + sWeight + " كجم";
        document.getElementById('rFaces').innerText = faces;
        document.getElementById('resSeed').innerText = seedDisplay;

        // حساب المركب
        if (isComp) {
            const cBags = parseFloat(document.getElementById('c1').value);
            const cWeight = parseFloat(document.getElementById('c2').value);
            
            if (cBags && cWeight) {
                // المعادلة: [(الأكياس * الوزن) / (المساحة / 100)] / 10
                let compValRaw = ((cBags * cWeight) / (area / 100)) / 10;
                let compDisplay = "";

                // التحويل التلقائي للمركب (إذا وصل 1000 جرام يصبح 1 كجم)
                if (compValRaw >= 1000) {
                    compDisplay = (compValRaw / 1000).toFixed(2) + " كجم";
                } else {
                    compDisplay = compValRaw.toFixed(2) + " جرام";
                }
                
                document.getElementById('compRow').style.display = 'table-row';
                document.getElementById('rCompInfo').innerText = cBags + " كيس × " + cWeight + " كجم";
                document.getElementById('resComp').innerText = compDisplay;
            } else {
                alert("يرجى إكمال بيانات المركب"); return;
            }
        } else {
            document.getElementById('compRow').style.display = 'none';
            document.getElementById('resComp').innerText = "لا يوجد مركب";
        }

        document.getElementById('finalReport').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
